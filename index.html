<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#175ba9"><title>MyStudy – הלימודים שלי</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:Arial,'Noto Sans Hebrew',sans-serif;color:#18253c;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:3}header strong{font-size:24px;color:#13569d}header small{display:block;font-size:12px;color:#67768c}main{max-width:1100px;margin:24px auto;padding:0 16px 80px}.hero{background:linear-gradient(115deg,#145ba7,#337fc8);border-radius:22px;color:white;padding:30px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:29px}.hero p{margin:0;opacity:.92}.layout{display:grid;grid-template-columns:235px 1fr;gap:18px}.panel{background:#fff;border:1px solid #e1e8f2;border-radius:18px;padding:20px;box-shadow:0 5px 22px #1934540a;margin-bottom:16px}.sidebar button,.tabs button{width:100%;border:0;background:transparent;text-align:right;padding:13px;border-radius:10px;color:#33445e}.sidebar button.active,.tabs button.active{background:#e8f1ff;color:#145ca6;font-weight:bold}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}.tabs button{width:auto}.btn{background:#1765b5;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:bold}.btn.alt{background:#edf4fd;color:#145a9f}.btn.danger{background:#fff0f0;color:#b72f38}.btn:disabled{opacity:.5}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.toolbar h2{margin:0;font-size:21px}input,textarea,select{width:100%;border:1px solid #cbd6e5;border-radius:10px;padding:11px;background:white;color:#18253c}textarea{min-height:120px;resize:vertical}label{display:block;font-weight:600;margin:12px 0 6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{background:#f8fbff;border:1px solid #dfe8f5;border-radius:14px;padding:16px}.tile h3{margin:0 0 9px}.tile p{color:#5b6c84;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#66758b}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.empty{padding:45px 15px;text-align:center;color:#697a91;border:2px dashed #d6e2f0;border-radius:14px}.hidden{display:none!important}.question{padding:18px;background:#f7faff;border:1px solid #dce7f5;border-radius:14px;margin:12px 0}.question label{font-weight:normal;display:flex;gap:10px;align-items:center}.question input[type=radio]{width:auto}.score{padding:15px;background:#e6f7ed;border-radius:12px;color:#165b36;font-weight:bold}.flash{min-height:180px;border:2px solid #b8d3f4;background:#f5f9ff;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:23px;font-weight:bold;padding:24px;cursor:pointer;white-space:pre-wrap}.notice{background:#fff8e8;border:1px solid #f2d9a6;border-radius:10px;padding:12px;font-size:14px}.footer{font-size:12px;color:#718096;margin-top:20px}dialog{border:0;border-radius:18px;width:min(94vw,580px);padding:24px;box-shadow:0 20px 90px #0a204555}dialog::backdrop{background:#14233a9c}dialog h2{margin-top:0}.close{float:left;border:0;background:#eaf0f7;border-radius:8px;padding:8px}.tag{display:inline-block;background:#e9f1ff;color:#1b5c9e;border-radius:30px;padding:5px 10px;font-size:12px}.small{font-size:13px}@media(max-width:750px){main{margin:12px auto}.layout{display:block}.sidebar{display:flex;overflow-x:auto;gap:4px;padding:8px}.sidebar button{white-space:nowrap;width:auto}.hero{padding:22px}.hero h1{font-size:25px}.panel{padding:15px}header{padding:12px 16px}}
</style></head><body><header><div><strong>📘 MyStudy</strong><small>לומדים בדרך שלך</small></div><button class="btn alt" id="backupBtn">גיבוי ושחזור</button></header><main><section class="hero"><h1>מה נלמד היום?</h1><p>מקצועות, סיכומים, כרטיסיות ומבחנים — במקום אחד.</p></section><div class="layout"><aside class="panel sidebar" id="nav"></aside><section id="content"></section></div><p class="footer">המידע נשמר בדפדפן במכשיר הזה בלבד. מומלץ לייצא גיבוי באופן קבוע. גרסה 1.0 • ללא חשבון וללא מנוי.</p></main><dialog id="modal"><button class="close" onclick="modal.close()" aria-label="סגירה">✕</button><div id="modalBody"></div></dialog><script>
'use strict';
const KEY='mystudy-v1';const initial={subjects:[],notes:[],cards:[],quizzes:[],results:[]};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=structuredClone(initial)}let page='subjects',subject='all',flip=false,cardIndex=0;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('לא ניתן לשמור: ייתכן שהאחסון במכשיר מלא. בצעי גיבוי ומחקי חומר ישן.');return false}},list=(arr)=>subject==='all'?arr:arr.filter(x=>x.subject===subject),subName=x=>data.subjects.find(s=>s.id===x)?.name||'ללא מקצוע',empty=txt=>`<div class="empty">${txt}</div>`,act=(label,fn,cls='alt')=>`<button class="btn ${cls}" data-action="${fn}">${label}</button>`;
function render(){const pages=[['subjects','🏠 מקצועות'],['notes','📝 סיכומים'],['cards','🧠 כרטיסיות'],['quizzes','📋 מבחנים']];$('nav').innerHTML=pages.map(([k,t])=>`<button data-page="${k}" class="${page===k?'active':''}">${t}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});let html='';if(page==='subjects'){html=`<div class="panel"><div class="toolbar"><h2>המקצועות שלי</h2>${act('＋ מקצוע חדש','newSubject','')}</div><div class="grid">${data.subjects.map(s=>`<div class="tile"><h3>${esc(s.name)}</h3><p>${esc(s.description||'')}</p><div class="actions">${act('פתיחה','openSubject:'+s.id)} ${act('עריכה','editSubject:'+s.id)} ${act('מחיקה','delSubject:'+s.id,'danger')}</div></div>`).join('')}</div>${data.subjects.length?'':empty('עדיין אין מקצועות. לחצי על ״מקצוע חדש״ כדי להתחיל.')}</div>`}else{let heading={notes:'סיכומים וחומרי לימוד',cards:'כרטיסיות לשינון',quizzes:'מבחנים ותרגול'}[page];html=`<div class="panel"><div class="toolbar"><h2>${heading}</h2>${act('＋ הוספה','new:'+page,'')}</div><label for="subjectFilter">סינון לפי מקצוע</label><select id="subjectFilter"><option value="all">כל המקצועות</option>${data.subjects.map(s=>`<option value="${esc(s.id)}" ${subject===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><div style="height:16px"></div>${page==='notes'?renderNotes():page==='cards'?renderCards():renderQuizzes()}</div>`}$('content').innerHTML=html;$('subjectFilter')?.addEventListener('change',e=>{subject=e.target.value;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handle(b.dataset.action));}
function renderNotes(){const arr=list(data.notes);return `<div class="grid">${arr.map(n=>`<div class="tile"><span class="tag">${esc(subName(n.subject))}</span><h3>${esc(n.title)}</h3><p>${esc(n.text.slice(0,210))}${n.text.length>210?'…':''}</p><div class="actions">${act('פתיחה','viewNote:'+n.id)} ${act('עריכה','editNote:'+n.id)} ${act('מחיקה','delNote:'+n.id,'danger')}</div></div>`).join('')}</div>${arr.length?'':empty('עדיין אין סיכומים. אפשר לכתוב, להדביק טקסט או לייבא קובץ טקסט.')}`}
function renderCards(){const arr=list(data.cards);if(!arr.length)return empty('אין כרטיסיות עדיין. הוסיפי כרטיסייה ראשונה.');cardIndex=Math.min(cardIndex,arr.length-1);let c=arr[cardIndex];return `<div class="muted small">כרטיסייה ${cardIndex+1} מתוך ${arr.length} • ${esc(subName(c.subject))}</div><div class="flash" id="flash" tabindex="0" role="button" aria-label="לחצי להפיכת הכרטיסייה">${esc(flip?c.back:c.front)}</div><p class="muted small">לחצי על הכרטיסייה כדי לראות ${flip?'שאלה':'תשובה'}</p><div class="actions">${act('הקודמת','prevCard')} ${act('הבאה','nextCard')} ${act('עריכה','editCard:'+c.id)} ${act('מחיקה','delCard:'+c.id,'danger')}</div>`}
function renderQuizzes(){const arr=list(data.quizzes);return `<div class="grid">${arr.map(q=>`<div class="tile"><span class="tag">${esc(subName(q.subject))}</span><h3>${esc(q.title)}</h3><p>${q.questions.length} שאלות</p><div class="actions">${act('התחלת מבחן','takeQuiz:'+q.id,'')} ${act('עריכה','editQuiz:'+q.id)} ${act('מחיקה','delQuiz:'+q.id,'danger')}</div></div>`).join('')}</div>${arr.length?'':empty('אין מבחנים עדיין. צרי מבחן והוסיפי לו שאלות ותשובות.')}${data.results.length?`<h3>תוצאות אחרונות</h3>${data.results.slice(-5).reverse().map(r=>`<p class="small">${esc(r.title)} — ${r.score}/${r.total} • ${esc(r.date)}</p>`).join('')}`:''}`}
function show(html){$('modalBody').innerHTML=html;$('modal').showModal();}function formSubmit(fn){$('editForm').onsubmit=e=>{e.preventDefault();fn(new FormData(e.target))}}
function subjectOptions(selected=''){return `<option value="">ללא מקצוע</option>${data.subjects.map(s=>`<option value="${esc(s.id)}" ${selected===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}`}
function subjectEditor(obj){show(`<h2>${obj?'עריכת מקצוע':'מקצוע חדש'}</h2><form id="editForm"><label>שם המקצוע</label><input name="name" maxlength="80" required value="${esc(obj?.name||'')}"><label>תיאור (לא חובה)</label><textarea name="description">${esc(obj?.description||'')}</textarea><p><button class="btn">שמירה</button></p></form>`);formSubmit(f=>{let v={name:f.get('name').trim(),description:f.get('description').trim()};if(!v.name)return;if(obj)Object.assign(obj,v);else data.subjects.push({id:id(),...v});save();modal.close();render()})}
function noteEditor(obj){show(`<h2>${obj?'עריכת סיכום':'סיכום חדש'}</h2><form id="editForm"><label>מקצוע</label><select name="subject">${subjectOptions(obj?.subject|| (subject==='all'?'':subject))}</select><label>כותרת</label><input name="title" required maxlength="120" value="${esc(obj?.title||'')}"><label>תוכן הסיכום</label><textarea name="text" id="noteText" rows="11" required>${esc(obj?.text||'')}</textarea><label>ייבוא קובץ טקסט (TXT / MD)</label><input type="file" id="textFile" accept=".txt,.md,text/plain,text/markdown"><p class="muted small">קובצי PDF ו־Word אינם מפוענחים בגרסה זו. ניתן להעתיק מהם טקסט ולהדביק כאן.</p><p><button class="btn">שמירה</button></p></form>`);$('textFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>1500000){alert('הקובץ גדול מדי (עד 1.5MB)');return}try{$('noteText').value=await f.text();if(!$('editForm').elements.title.value)$('editForm').elements.title.value=f.name.replace(/\.[^.]+$/,'')}catch{alert('לא הצלחנו לקרוא את הקובץ')}};formSubmit(f=>{let v={subject:f.get('subject'),title:f.get('title').trim(),text:f.get('text').trim()};if(!v.text)return;if(obj)Object.assign(obj,v);else data.notes.push({id:id(),...v});save();modal.close();render()})}
function cardEditor(obj){show(`<h2>${obj?'עריכת כרטיסייה':'כרטיסייה חדשה'}</h2><form id="editForm"><label>מקצוע</label><select name="subject">${subjectOptions(obj?.subject|| (subject==='all'?'':subject))}</select><label>צד קדמי – שאלה / מושג</label><textarea name="front" required>${esc(obj?.front||'')}</textarea><label>צד אחורי – תשובה / פירוש</label><textarea name="back" required>${esc(obj?.back||'')}</textarea><p><button class="btn">שמירה</button></p></form>`);formSubmit(f=>{let v={subject:f.get('subject'),front:f.get('front').trim(),back:f.get('back').trim()};if(obj)Object.assign(obj,v);else data.cards.push({id:id(),...v});save();flip=false;modal.close();render()})}
function quizEditor(obj){let q=obj||{title:'',subject:subject==='all'?'':subject,questions:[]};show(`<h2>${obj?'עריכת מבחן':'מבחן חדש'}</h2><form id="editForm"><label>מקצוע</label><select name="subject">${subjectOptions(q.subject)}</select><label>שם המבחן</label><input name="title" required value="${esc(q.title)}"><div id="questionsEdit"></div><div class="actions"><button type="button" class="btn alt" id="addQuestion">＋ הוספת שאלה</button><button class="btn">שמירת מבחן</button></div></form>`);const box=$('questionsEdit');function addQuestion(question={question:'',options:['','','',''],correct:0}){let i=box.children.length;let el=document.createElement('fieldset');el.style.cssText='border:1px solid #d9e3f0;border-radius:12px;margin:14px 0;padding:12px';el.innerHTML=`<legend>שאלה ${i+1}</legend><label>נוסח השאלה</label><input class="qtext" required value="${esc(question.question)}">${[0,1,2,3].map(j=>`<label>תשובה ${j+1}</label><input class="opt" required value="${esc(question.options[j]||'')}">`).join('')}<label>מספר התשובה הנכונה</label><select class="correct">${[0,1,2,3].map(j=>`<option value="${j}" ${question.correct===j?'selected':''}>${j+1}</option>`).join('')}</select><button type="button" class="btn danger removeQuestion">מחיקת שאלה</button>`;el.querySelector('.removeQuestion').onclick=()=>el.remove();box.appendChild(el)}q.questions.forEach(addQuestion);if(!q.questions.length)addQuestion();$('addQuestion').onclick=()=>addQuestion();formSubmit(f=>{const questions=[...box.children].map(el=>({question:el.querySelector('.qtext').value.trim(),options:[...el.querySelectorAll('.opt')].map(x=>x.value.trim()),correct:Number(el.querySelector('.correct').value)}));if(!questions.length){alert('צריך לפחות שאלה אחת');return}let v={subject:f.get('subject'),title:f.get('title').trim(),questions};if(obj)Object.assign(obj,v);else data.quizzes.push({id:id(),...v});save();modal.close();render()})}
function takeQuiz(q){show(`<h2>${esc(q.title)}</h2><form id="testForm">${q.questions.map((x,i)=>`<div class="question"><b>${i+1}. ${esc(x.question)}</b>${x.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" required>${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn">בדיקת תשובות</button></form><div id="testResult"></div>`);$('testForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),score=q.questions.filter((x,i)=>Number(f.get('q'+i))===x.correct).length;data.results.push({id:id(),title:q.title,score,total:q.questions.length,date:new Date().toLocaleDateString('he-IL')});save();$('testResult').innerHTML=`<div class="score">הציון שלך: ${score} מתוך ${q.questions.length}</div>${q.questions.map((x,i)=>`<p><b>${esc(x.question)}</b><br>התשובה הנכונה: ${esc(x.options[x.correct])} ${Number(f.get('q'+i))===x.correct?'✓':'✗'}</p>`).join('')}`;$('testForm').querySelector('button').disabled=true}}
function backup(){show(`<h2>גיבוי ושחזור</h2><p>המידע נשמר רק בדפדפן הנוכחי. מומלץ לשמור גיבוי גם מחוץ למכשיר.</p><button class="btn" id="export">⬇ הורדת גיבוי</button><label>שחזור מקובץ גיבוי</label><input type="file" id="restore" accept=".json,application/json"><p class="notice">שחזור מחליף את כל הנתונים הקיימים. אין לשתף גיבויים המכילים חומר פרטי.</p>`);$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mystudy-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();let d=JSON.parse(await f.text());if(!['subjects','notes','cards','quizzes','results'].every(k=>Array.isArray(d[k])))throw Error();if(!confirm('למחוק את הנתונים הנוכחיים ולשחזר מהגיבוי?'))return;data=d;save();modal.close();subject='all';page='subjects';render()}catch{alert('קובץ הגיבוי אינו תקין או גדול מדי')}}}
function handle(a){let [action,arg]=a.split(':');if(action==='newSubject')return subjectEditor();if(action==='editSubject')return subjectEditor(data.subjects.find(x=>x.id===arg));if(action==='openSubject'){subject=arg;page='notes';return render()}if(action==='new'){return ({notes:noteEditor,cards:cardEditor,quizzes:quizEditor})[arg]()}if(action==='viewNote'){let n=data.notes.find(x=>x.id===arg);return show(`<h2>${esc(n.title)}</h2><p class="muted">${esc(subName(n.subject))}</p><div style="white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere">${esc(n.text)}</div>`)}if(action==='editNote')return noteEditor(data.notes.find(x=>x.id===arg));if(action==='editCard')return cardEditor(data.cards.find(x=>x.id===arg));if(action==='editQuiz')return quizEditor(data.quizzes.find(x=>x.id===arg));if(action==='takeQuiz')return takeQuiz(data.quizzes.find(x=>x.id===arg));if(action==='prevCard'||action==='nextCard'){let n=list(data.cards).length;cardIndex=(cardIndex+(action==='nextCard'?1:-1)+n)%n;flip=false;return render()}if(action.startsWith('del')){let group={delSubject:'subjects',delNote:'notes',delCard:'cards',delQuiz:'quizzes'}[action];if(!confirm('למחוק את הפריט? לא ניתן לבטל את המחיקה.'))return;data[group]=data[group].filter(x=>x.id!==arg);if(action==='delSubject'){for(let k of ['notes','cards','quizzes'])data[k].forEach(x=>{if(x.subject===arg)x.subject='' });if(subject===arg)subject='all'}save();render()}}
$('content').addEventListener('click',e=>{if(e.target.closest('#flash')){flip=!flip;render()}});$('content').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='flash'){flip=!flip;render()}});$('backupBtn').onclick=backup;render();
</script></body></html>
